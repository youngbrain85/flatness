[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flatness-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "laspy[lazrs]>=2.5", "matplotlib>=3.8", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "psutil>=5.9"]

[project.scripts]
flatness = "flatness.cli:main"

[tool.setuptools.packages.find]
include = ["flatness*"]

[tool.setuptools.package-data]
flatness = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not perf'"
markers = ["perf: 대용량 성능·메모리 실측 (기본 제외, -m perf 로 실행)"]
