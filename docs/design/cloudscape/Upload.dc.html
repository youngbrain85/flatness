<!doctype html>
<html>
<head>

</head>
<body>
<x-dc>
<helmet>

  <style>
    body { margin: 0; background: #ffffff; }
    a { color: #0972d3; text-decoration: none; }

    table { border-collapse: collapse; }

</helmet>
<div style="position: relative; width: 1440px; height: 1080px; overflow: hidden; background: #ffffff; color: #000716; font-family: 'Open Sans', 'Noto Sans KR', 'Helvetica Neue', Roboto, Arial, sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 24px; height: 44px; flex-shrink: 0; padding: 0 20px; background: #0f1b2a; color: #ffffff;">
    <a href="#" style="display: flex; align-items: center; gap: 10px; color: #ffffff; font-size: 16px; font-weight: 700; letter-spacing: 0.02em;">
      <span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"></path><path d="M14 7h7v7"></path></svg>
      </span>
      <span>FLATNESS</span>
    </a>
    <div style="display: flex; align-items: center; gap: 20px; margin-left: auto;">
      <button style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px; background: transparent; border: 0; color: #d1d5db; font-size: 14px; font-weight: 700; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"></path></svg>
        <span>[사용자 이메일]</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
  </header>

  <div style="display: flex; flex: 1; min-height: 0;">

    <nav style="display: flex; flex-direction: column; width: 280px; flex-shrink: 0; background: #ffffff; border-right: 1px solid #e9ebed;">
      <div style="padding: 20px 28px 12px; border-bottom: 1px solid #e9ebed; font-size: 16px; line-height: 20px; font-weight: 700;">평활도 분석 콘솔</div>
      <div style="display: flex; flex-direction: column; padding: 12px 0;">
        <a href="#" style="display: flex; align-items: center; padding: 8px 28px; color: #414d5c;">현장</a>
        <a href="#" style="display: flex; align-items: center; padding: 8px 28px; color: #414d5c;">보고서</a>
        <a href="#" style="display: flex; align-items: center; padding: 8px 28px; color: #0972d3; font-weight: 700;">업로드</a>
      </div>
      <div style="height: 1px; margin: 0 28px; background: #e9ebed;"></div>
      <div style="display: flex; flex-direction: column; padding: 12px 0;">
        <a href="#" style="display: flex; align-items: center; padding: 8px 28px; color: #414d5c;">설정</a>
        <a href="#" style="display: flex; align-items: center; padding: 8px 28px; color: #414d5c;">로그아웃</a>
      </div>
    </nav>

    <main style="display: flex; flex-direction: column; gap: 20px; flex: 1; min-width: 0; padding: 20px 40px 40px;">

      <nav style="display: flex; align-items: center; gap: 8px; font-size: 14px;">
        <a href="#" style="color: #0972d3;">현장</a>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        <span style="color: #5f6b7a;">스캔 업로드</span>
      </nav>

      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
        <h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 700;">스캔 업로드</h1>
      </div>

      <div style="display: flex; flex-direction: column; background: #ffffff; border-radius: 16px; box-shadow: 0 1px 1px 1px #e9ebed, 0 1px 8px 2px rgba(0, 7, 22, 0.12);">
        <div style="padding: 12px 20px; border-bottom: 1px solid #e9ebed;">
          <span style="font-size: 18px; line-height: 22px; font-weight: 700;">업로드 정보</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px;">

          <div style="display: flex; align-items: center; gap: 24px;">
            <label style="display: inline-flex; align-items: center; gap: 8px;">
              <span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #0972d3; border-radius: 50%;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #0972d3;"></span></span>
              <span>스캔 분석</span>
            </label>
            <label style="display: inline-flex; align-items: center; gap: 8px;">
              <span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #8c8c94; border-radius: 50%;"></span>
              <span>기존 결과 가져오기(CSV/JSON)</span>
            </label>
          </div>

          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px;">

            <div style="display: flex; flex-direction: column; gap: 16px;">

              <div style="display: flex; flex-direction: column; gap: 8px;">
                <div style="display: flex; flex-direction: column; gap: 4px;">
                  <label style="font-weight: 700;">측정위치</label>
                  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 8px; border: 2px solid #8c8c94; border-radius: 8px; background: #ffffff;">
                    <span>101동 / 3층 / 301호 / 거실</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
                  </div>
                </div>
                <a href="#" style="display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; color: #0972d3; font-weight: 700;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                  <span>새 측정위치</span>
                </a>
                <div style="display: flex; flex-direction: column; gap: 16px; padding: 16px; border: 1px solid #e9ebed; border-radius: 8px; background: #ffffff;">
                  <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="font-weight: 700;">현장 선택 또는 새 현장명</label>
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 8px; border: 2px solid #8c8c94; border-radius: 8px; background: #ffffff;">
                      <span>+ 새 현장 만들기</span>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
                    </div>
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 4px;">
                    <label style="font-weight: 700;">새 현장명</label>
                    <div style="display: flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 8px; border: 2px solid #8c8c94; border-radius: 8px; background: #ffffff; color: #5f6b7a;"></div>
                  </div>
                  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px;">
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                      <label style="font-weight: 700;">동</label>
                      <div style="display: flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 8px; border: 2px solid #8c8c94; border-radius: 8px; background: #ffffff;"></div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                      <label style="font-weight: 700;">층</label>
                      <div style="display: flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 8px; border: 2px solid #8c8c94; border-radius: 8px; background: #ffffff;"></div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                      <label style="font-weight: 700;">공간</label>
                      <div style="display: flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 8px; border: 2px solid #8c8c94; border-radius: 8px; background: #ffffff;"></div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                      <label style="font-weight: 700;">이름</label>
                      <div style="display: flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 8px; border: 2px solid #8c8c94; border-radius: 8px; background: #ffffff;"></div>
                    </div>
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <a href="#" style="display: inline-flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 20px; border: 2px solid #0972d3; border-radius: 20px; background: #0972d3; color: #ffffff; font-weight: 700;">저장</a>
                    <a href="#" style="display: inline-flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 20px; border: 2px solid #0972d3; border-radius: 20px; color: #0972d3; font-weight: 700; background: transparent;">취소</a>
                  </div>
                </div>
              </div>

              <div style="display: flex; flex-direction: column; gap: 4px;">
                <label style="font-weight: 700;">표면 유형</label>
                <div style="display: flex; align-items: center; gap: 24px;">
                  <label style="display: inline-flex; align-items: center; gap: 8px;">
                    <span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #0972d3; border-radius: 50%;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #0972d3;"></span></span>
                    <span>바닥</span>
                  </label>
                  <label style="display: inline-flex; align-items: center; gap: 8px;">
                    <span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #8c8c94; border-radius: 50%;"></span>
                    <span>벽면</span>
                  </label>
                </div>
              </div>

              <div style="display: flex; flex-direction: column; gap: 4px;">
                <label style="font-weight: 700;">데이터 계보</label>
                <div style="display: flex; align-items: center; gap: 24px;">
                  <label style="display: inline-flex; align-items: center; gap: 8px;">
                    <span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #8c8c94; border-radius: 50%;"></span>
                    <span>원시 점군</span>
                  </label>
                  <label style="display: inline-flex; align-items: center; gap: 8px;">
                    <span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #8c8c94; border-radius: 50%;"></span>
                    <span>융합 메시</span>
                  </label>
                  <label style="display: inline-flex; align-items: center; gap: 8px;">
                    <span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #0972d3; border-radius: 50%;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #0972d3;"></span></span>
                    <span>모름</span>
                  </label>
                </div>
              </div>

            </div>

            <div style="display: flex; flex-direction: column; gap: 16px;">

              <div style="display: flex; flex-direction: column; gap: 4px;">
                <span style="font-weight: 700;">적용 기준</span>
                <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid #e9ebed; border-radius: 8px; background: #ffffff;">
                  <label style="display: flex; align-items: flex-start; gap: 8px;">
                    <span style="display: flex; align-items: center; flex-shrink: 0; height: 20px;"><span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #8c8c94; border-radius: 50%;"></span></span>
                    <span style="display: flex; flex-direction: column;">
                      <span style="display: inline-flex; align-items: baseline; gap: 6px;"><span style="font-family: Monaco, Menlo, Consolas, 'Courier New', monospace; font-size: 13px;">floor-kcs-finish7plus</span></span>
                      <span style="font-size: 12px; line-height: 16px; color: #5f6b7a;">KCS 14 20 10 표 3.7-1 (마감두께 7mm 이상)</span>
                    </span>
                  </label>
                  <label style="display: flex; align-items: flex-start; gap: 8px;">
                    <span style="display: flex; align-items: center; flex-shrink: 0; height: 20px;"><span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #8c8c94; border-radius: 50%;"></span></span>
                    <span style="display: flex; flex-direction: column;">
                      <span style="display: inline-flex; align-items: baseline; gap: 6px;"><span style="font-family: Monaco, Menlo, Consolas, 'Courier New', monospace; font-size: 13px;">floor-kcs-finish7minus</span></span>
                      <span style="font-size: 12px; line-height: 16px; color: #5f6b7a;">KCS 14 20 10 표 3.7-1 (마감두께 7mm 미만)</span>
                    </span>
                  </label>
                  <label style="display: flex; align-items: flex-start; gap: 8px;">
                    <span style="display: flex; align-items: center; flex-shrink: 0; height: 20px;"><span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #0972d3; border-radius: 50%;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #0972d3;"></span></span></span>
                    <span style="display: flex; flex-direction: column;">
                      <span style="display: inline-flex; align-items: baseline; gap: 6px;"><span style="font-family: Monaco, Menlo, Consolas, 'Courier New', monospace; font-size: 13px;">floor-kcs-exposed</span><em style="font-style: normal; font-size: 12px; color: #5f6b7a;">(기본)</em></span>
                      <span style="font-size: 12px; line-height: 16px; color: #5f6b7a;">KCS 14 20 10 표 3.7-1 (제물치장·얇은 마감)</span>
                    </span>
                  </label>
                  <label style="display: flex; align-items: flex-start; gap: 8px;">
                    <span style="display: flex; align-items: center; flex-shrink: 0; height: 20px;"><span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #8c8c94; border-radius: 50%;"></span></span>
                    <span style="display: flex; flex-direction: column;">
                      <span style="display: inline-flex; align-items: baseline; gap: 6px;"><span style="font-family: Monaco, Menlo, Consolas, 'Courier New', monospace; font-size: 13px;">floor-molit-cushion</span></span>
                      <span style="font-size: 12px; line-height: 16px; color: #5f6b7a;">국토부 바닥충격음 고시 (완충재 바탕)</span>
                    </span>
                  </label>
                  <label style="display: flex; align-items: flex-start; gap: 8px;">
                    <span style="display: flex; align-items: center; flex-shrink: 0; height: 20px;"><span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #8c8c94; border-radius: 50%;"></span></span>
                    <span style="display: flex; flex-direction: column;">
                      <span style="display: inline-flex; align-items: baseline; gap: 6px;"><span style="font-family: Monaco, Menlo, Consolas, 'Courier New', monospace; font-size: 13px;">floor-lh-exposed</span></span>
                      <span style="font-size: 12px; line-height: 16px; color: #5f6b7a;">LHCS 14 20 10 05 표 3.11-7 (제물치장·도장·벽지)</span>
                    </span>
                  </label>
                  <label style="display: flex; align-items: flex-start; gap: 8px;">
                    <span style="display: flex; align-items: center; flex-shrink: 0; height: 20px;"><span style="display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; box-sizing: border-box; border: 2px solid #8c8c94; border-radius: 50%;"></span></span>
                    <span style="display: flex; flex-direction: column;">
                      <span style="display: inline-flex; align-items: baseline; gap: 6px;"><span style="font-family: Monaco, Menlo, Consolas, 'Courier New', monospace; font-size: 13px;">floor-lh-thick</span></span>
                      <span style="font-size: 12px; line-height: 16px; color: #5f6b7a;">LHCS 14 20 10 05 표 3.11-7 (마감 13mm 초과)</span>
                    </span>
                  </label>
                </div>
              </div>

              <div style="display: flex; align-items: flex-start; gap: 16px;">
                <div style="display: flex; flex-direction: column; gap: 4px; width: 180px; flex-shrink: 0;">
                  <label style="font-weight: 700;">측정일자</label>
                  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 8px; border: 2px solid #8c8c94; border-radius: 8px; background: #ffffff;">
                    <span style="font-family: Monaco, Menlo, Consolas, 'Courier New', monospace; font-size: 13px;">2026-09-03</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>
                  </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0;">
                  <label style="font-weight: 700;">장비</label>
                  <div style="display: flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 8px; border: 2px solid #8c8c94; border-radius: 8px; background: #ffffff; color: #5f6b7a;">예: iPhone 15 Pro + 3d Scanner App</div>
                </div>
              </div>

              <div style="display: flex; flex-direction: column; gap: 4px;">
                <label style="font-weight: 700;">담당자 이름(직접 입력, 비우면 로그인 사용자)</label>
                <div style="display: flex; align-items: center; height: 32px; box-sizing: border-box; padding: 0 8px; border: 2px solid #8c8c94; border-radius: 8px; background: #ffffff;"></div>
              </div>

              <div style="display: flex; flex-direction: column; gap: 4px;">
                <label style="font-weight: 700;">스캔 파일 (ply/las/laz/xyz/txt/csv/pts)</label>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                  <div style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 20px; border: 2px dashed #8c8c94; border-radius: 8px; background: #ffffff;">
                    <a href="#" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; box-sizing: border-box; padding: 0 20px; border: 2px solid #0972d3; border-radius: 20px; color: #0972d3; font-weight: 700; background: transparent;">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>
                      <span>파일 선택</span>
                    </a>
                    <span style="color: #5f6b7a;">또는 파일을 여기에 끌어다 놓기</span>
                  </div>
                  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 24px;">
                    <span style="display: inline-flex; align-items: center; gap: 6px; min-width: 0;">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"></path><path d="M14 3v5h5"></path></svg>
                      <span style="font-family: Monaco, Menlo, Consolas, 'Courier New', monospace; font-size: 13px;">scan_101_301_living.csv</span>
                    </span>
                    <a href="#" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; color: #5f6b7a;">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                    </a>
                  </div>
                  <span style="font-size: 12px; line-height: 16px; color: #5f6b7a;">파일은 Supabase Storage에 저장됩니다. 파일당 최대 <span style="font-family: Monaco, Menlo, Consolas, 'Courier New', monospace;">50</span>MB입니다.</span>
                </div>
              </div>

            </div>

          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
        <a href="#" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; box-sizing: border-box; padding: 0 20px; border: 2px solid #0972d3; border-radius: 20px; background: #0972d3; color: #ffffff; font-weight: 700;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>
          <span>업로드 후 사전 검사</span>
        </a>
      </div>

    </main>
  </div>
</div>
</x-dc>
</body>
</html>
