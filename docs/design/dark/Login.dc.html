<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 100vh; background: #0a0d1c; color: #f2efe9; font-family: Montserrat, 'Noto Sans KR', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 28px; min-height: 64px; padding: 8px clamp(16px, 3vw, 40px); box-sizing: border-box; border-bottom: 1px solid #1f2540">
<a href="#" style="display: inline-flex; align-items: center; gap: 10px; color: #f2efe9; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8" stroke="#F2EFE9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path><path d="M14 7h7v7" stroke="#F2EFE9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<span style="font-weight: 700; font-size: 15px; letter-spacing: 0.14em">FLATNESS</span>
</a>
</header>
<main style="display: flex; flex-direction: column; min-height: calc(100vh - 64px); background-color: #0a0d1c; background-image: {{gridBg}}; background-size: 25% 100%, 100% 33.33%">
<div style="flex: 1 1 auto; width: 100%; max-width: 1360px; margin: 0 auto; padding: clamp(18px, 2.6vw, 28px) clamp(16px, 3vw, 40px) 56px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
<section aria-labelledby="loginTitle" style="width: 100%; max-width: 400px; box-sizing: border-box; display: flex; flex-direction: column; background: #10142a; border: 1px solid #242b47; border-radius: 12px">
<div style="padding: 22px 24px 18px; border-bottom: 1px solid #1f2540">
<h1 id="loginTitle" style="margin: 0; font-family: 'Noto Sans KR', Montserrat, sans-serif; font-size: 24px; font-weight: 700; line-height: 1.25">평활도 분석 대시보드</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 22px 24px 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="loginEmail" style="font-size: 14px; font-weight: 600; color: #f2efe9">이메일</label>
<input id="loginEmail" type="email" placeholder="[사용자 이메일]" style="width: 100%; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid #2e3657; background: #0a0d1c; color: #f2efe9; font-family: inherit; font-size: 15px">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="loginPassword" style="font-size: 14px; font-weight: 600; color: #f2efe9">비밀번호</label>
<input id="loginPassword" type="password" placeholder="••••••••" style="width: 100%; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 6px; border: 1px solid #2e3657; background: #0a0d1c; color: #f2efe9; font-family: inherit; font-size: 15px">
</div>
<button type="button" style="width: 100%; min-height: 44px; margin-top: 4px; padding: 0 18px; border-radius: 6px; border: 1px solid #f2efe9; background: #f2efe9; color: #0a0d1c; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">로그인</button>
<p style="margin: 0; font-size: 13px; line-height: 1.55; color: #9a9690">계정은 관리자가 Supabase 대시보드(Authentication)에서 생성합니다.</p>
</div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motif":{"editor":"boolean","default":true,"section":"Look"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // 도면 격자 배경(tweak motif)을 켜고 끈다
    const motif = this.props.motif ?? true;
    return {
      gridBg: motif ? 'linear-gradient(to right, rgba(242, 239, 233, 0.07) 1px, transparent 1px), linear-gradient(to bottom, rgba(242, 239, 233, 0.07) 1px, transparent 1px)' : 'none'
    };
  }
}
</script>
</body>
</html>
