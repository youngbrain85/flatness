<script type="text/x-dc" data-dc-script data-props='{"motif":{"editor":"boolean","default":true,"section":"Look"},"$preview":{"width":1440,"height":1880}}'>
class Component extends DCLogic {
  renderVals() {
    const motif = this.props.motif ?? true;
    // 종합의견 초안: 분석별 자동 의견을 [종류 표면] 머리말과 함께 빈 줄로 잇는다(앱 buildDraftOpinion 과 같은 모양).
    // 문장은 옛 아트보드 ReportNew 의 문구 그대로, 한 문장이 한 줄이다
    const paragraphs = [
      [
        '[평활도 바닥] 바닥면 평활도 분석 결과, 판정 셀 40개(유효 36개) 중 적합 30개, 경계 6개, 보수 0개, 재시공 0개, 판정 불가 4개로 나타났습니다. 적용 기준은 floor-kcs-exposed(허용 7mm, 불확도 U=5mm)입니다.',
        '최대 편차는 9.57mm로 좌표 (3.5, 4.5) (구역 1) 부근에서 관측되었습니다.',
        '일부 구간이 경계 판정입니다. 현장 재확인(실물 직선자 검측)을 권장합니다.',
        '일부 구간은 공간 제약으로 축소 스팬(허용치 선형 환산)으로 판정되었습니다.',
        '본 결과는 모바일 LiDAR 기반 스크리닝이며 공식 검측(실물 직선자·레벨 측량)을 대체하지 않습니다.'
      ],
      [
        '[평활도 바닥] 바닥면 평활도 분석 결과, 판정 셀 40개(유효 37개) 중 적합 37개, 경계 0개, 보수 0개, 재시공 0개, 판정 불가 3개로 나타났습니다. 적용 기준은 floor-kcs-exposed(허용 7mm, 불확도 U=5mm)입니다.',
        '최대 편차는 1.84mm로 좌표 (2.5, 1.5) (구역 1) 부근에서 관측되었습니다.',
        '전 구간이 적용 기준을 만족합니다.',
        '본 결과는 모바일 LiDAR 기반 스크리닝이며 공식 검측(실물 직선자·레벨 측량)을 대체하지 않습니다.'
      ],
      [
        '[평활도 바닥] 바닥면 평활도 분석 결과, 판정 셀 40개(유효 38개) 중 적합 9개, 경계 14개, 보수 12개, 재시공 3개, 판정 불가 2개로 나타났습니다. 적용 기준은 floor-kcs-exposed(허용 7mm, 불확도 U=5mm)입니다.',
        '최대 편차는 23.6mm로 좌표 (0.5, 3.5) (구역 1) 부근에서 관측되었습니다.',
        '재시공 검토 대상 구간이 존재합니다. 정밀 검측 및 시공 검토가 필요합니다.',
        '본 결과는 모바일 LiDAR 기반 스크리닝이며 공식 검측(실물 직선자·레벨 측량)을 대체하지 않습니다.'
      ],
      [
        '[평활도 벽면] 벽면 평활도 분석 결과, 판정 셀 96개(유효 94개) 중 적합 94개, 경계 0개, 보수 0개, 재시공 0개, 판정 불가 2개로 나타났습니다. 적용 기준은 [기준명](허용 [허용치]mm, 불확도 U=[불확도]mm)입니다.',
        '최대 편차는 1.36mm로 좌표 (1.2, 0.8) (벽 2) 부근에서 관측되었습니다.',
        '전 구간이 적용 기준을 만족합니다.',
        '수직도는 스캔 좌표계의 z축 기준 상대 지표입니다(중력 보정 아님).',
        '본 결과는 모바일 LiDAR 기반 스크리닝이며 공식 검측(실물 직선자·레벨 측량)을 대체하지 않습니다.'
      ]
    ];
    return {
      on: true,
      opinion: paragraphs.map((p) => p.join('\n')).join('\n\n'),
      gridBg: motif ? 'linear-gradient(to right, rgba(242, 239, 233, 0.07) 1px, transparent 1px), linear-gradient(to bottom, rgba(242, 239, 233, 0.07) 1px, transparent 1px)' : 'none'
    };
  }

</script>
