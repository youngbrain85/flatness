class Component extends DCLogic {
  constructor(props) {
    super(props);
    // 삭제는 앱(report-delete-button.tsx)처럼 한 번 더 묻는다. 확인 상자를 여닫는 것만 state 로 둔다
    this.state = { confirming: false };
  }
  renderVals() {
    const motif = this.props.motif ?? true;
    const open = this.state.confirming;
    return {
      confirming: open,
      delExpanded: open ? 'true' : 'false',
      toggleDel: () => this.setState({ confirming: !this.state.confirming }),
      closeDel: () => this.setState({ confirming: false }),
      gridBg: motif ? 'linear-gradient(to right, rgba(242, 239, 233, 0.07) 1px, transparent 1px), linear-gradient(to bottom, rgba(242, 239, 233, 0.07) 1px, transparent 1px)' : 'none'
    };
